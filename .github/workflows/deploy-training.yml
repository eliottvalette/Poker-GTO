name: Validate and deploy continuous poker training
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: training-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r deploy/vps/requirements.txt
      - run: PYTHONPATH=.:tests python -m unittest test_vps_training test_publication test_vps_deployment test_deployment_provenance test_hourly_evaluation test_onnx_export
      - run: npm ci && npm run lint && npm run build
        working-directory: ui
      - run: node tests/run_browser_tests.mjs
      - run: |
          python -c "from pathlib import Path; from training.runner import write_source_manifest; write_source_manifest(Path('.'), Path('deployment-source.json'))"
          git archive --format=tar --output=training.tar HEAD
          tar -rf training.tar deployment-source.json
          gzip training.tar
          mkdir -p "$RUNNER_TEMP/gto-source-check"
          tar -xzf training.tar.gz -C "$RUNNER_TEMP/gto-source-check"
          python -c "import os; from pathlib import Path; from training.runner import source_metadata; print(source_metadata(Path(os.environ['RUNNER_TEMP']) / 'gto-source-check'))"
      - uses: actions/upload-artifact@v4
        with:
          name: training-source
          path: training.tar.gz
          retention-days: 2
  deploy:
    needs: validate
    if: vars.GTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: training-source
      - name: Configure SSH agent and pinned hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_PASSPHRASE"\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          SSH_ASKPASS_REQUIRE=force SSH_ASKPASS="$RUNNER_TEMP/askpass" DISPLAY=:0 ssh-add ~/.ssh/deploy_key </dev/null
          rm ~/.ssh/deploy_key "$RUNNER_TEMP/askpass"
      - name: Deliver tested revision and activate
        env:
          TARGET_HOST: 51.81.202.115
          TARGET_USER: ubuntu
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY" || { echo 'Missing SUPABASE_SECRET_KEY repository secret' >&2; exit 1; }
          umask 077
          printf 'SUPABASE_URL=https://vcyctuntcwrrcizvadwh.supabase.co\nSUPABASE_POLICY_BUCKET=poker-policies\nSUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY" > "$RUNNER_TEMP/publication.env"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'install -d -m 0700 ~/gto-incoming'
          scp -p -o BatchMode=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/publication.env" "$TARGET_USER@$TARGET_HOST:gto-incoming/publication.env"
          rm "$RUNNER_TEMP/publication.env"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" 'set -eu; sudo -n install -d -m 0750 /etc/gto; sudo -n install -m 0600 ~/gto-incoming/publication.env /etc/gto/publication.env; rm ~/gto-incoming/publication.env'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes training.tar.gz "$TARGET_USER@$TARGET_HOST:gto-incoming/$GITHUB_SHA.tar.gz"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/vps/install.sh "$TARGET_USER@$TARGET_HOST:gto-incoming/install.sh"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET_USER@$TARGET_HOST" "set -eu; sudo -n install -d -m 0750 /opt/gto/incoming; sudo -n install -m 0600 ~/gto-incoming/$GITHUB_SHA.tar.gz /opt/gto/incoming/$GITHUB_SHA.tar.gz; sudo -n bash ~/gto-incoming/install.sh '$GITHUB_SHA' both; rm ~/gto-incoming/$GITHUB_SHA.tar.gz ~/gto-incoming/install.sh"
      - name: Stop SSH agent
        if: always()
        run: if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k; fi
